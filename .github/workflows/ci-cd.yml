name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Validar (build)
        run: |
          python -m compileall -q app
          python -c "from app import create_app; create_app()"
      - name: Pruebas
        run: bash scripts/pruebas.sh
      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: reportes/
          if-no-files-found: error
  empaquetar:
    name: Empaquetar imagen
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v7
      - name: Calcular nombre de la imagen
        id: nombre
        # GHCR exige minúsculas; ${VAR,,} las convierte en Bash.
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Construir imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          docker build \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGEN" .
          docker image ls "$IMAGEN"
      - name: Publicar imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: docker push "$IMAGEN"
  staging:
    name: Desplegar en staging
    needs: empaquetar
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV=staging "$IMAGEN"
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080
  produccion:
    name: Desplegar en producción
    needs: [empaquetar, staging]
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV=produccion "$IMAGEN"
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080
