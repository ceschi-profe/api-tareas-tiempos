name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Validar (build)
        run: |
          python -m compileall -q app
          python -c "from app import create_app; create_app()"
      - name: Lint
        run: ruff check .
      - name: Pruebas
        run: bash scripts/pruebas.sh
      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: reportes/
          if-no-files-found: error
  empaquetar:
    name: Empaquetar imagen
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v7
      - name: Calcular nombre de la imagen
        id: nombre
        # GHCR exige minúsculas; ${VAR,,} las convierte en Bash.
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Construir imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          docker build \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGEN" .
          docker image ls "$IMAGEN"
      - name: Publicar imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: docker push "$IMAGEN"
  staging:
    name: Desplegar en staging
    needs: empaquetar
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
          APP_ENV: ${{ vars.APP_ENV || 'staging' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV -e API_TOKEN "$IMAGEN"
      - name: Esperar health check del contenedor
        run: |
          for intento in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "intento $intento: $estado"
            [ "$estado" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke test
        env:
          VERSION_ESPERADA: ${{ github.sha }}
        run: bash scripts/smoke.sh http://localhost:8080
      - name: Guardar logs del contenedor
        if: always()
        run: docker logs api > logs-staging.txt 2>&1 || echo "sin contenedor" > logs-staging.txt
      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-staging
          path: logs-staging.txt
      - name: Resumen del despliegue
        if: always()
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
        run: |
          {
            echo "### Despliegue en staging"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Imagen | \`$IMAGEN\` |"
            echo "| Ejecución | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo "| Resultado del job | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
  produccion:
    name: Desplegar en producción
    needs: [empaquetar, staging]
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
          APP_ENV: ${{ vars.APP_ENV || 'produccion' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV -e API_TOKEN "$IMAGEN"
      - name: Smoke test
        env:
          VERSION_ESPERADA: ${{ github.sha }}
        run: bash scripts/smoke.sh http://localhost:8080
      - name: Guardar logs del contenedor
        if: always()
        run: docker logs api > logs-produccion.txt 2>&1 || echo "sin contenedor" > logs-produccion.txt
      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-produccion
          path: logs-produccion.txt
